<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CareBridge AI — Pharmacy Portal</title>

<!-- Supabase client library (skip if already included elsewhere in your app) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --teal: #0f6b5c;
    --teal-dark: #0a4f44;
    --teal-tint: #e4f0ee;
    --gray-dark: #2b2b2b;
    --gray-text: #444;
    --gray-muted: #74807d;
    --border: #d9e2e0;
    --danger: #c0392b;
    --danger-tint: #fbeae8;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif;
    background: #f5f7f7;
    color: var(--gray-dark);
    margin: 0;
    padding: 2.5rem 1.5rem;
  }

  .page {
    max-width: 1000px;
    margin: 0 auto;
  }

  .page-header {
    margin-bottom: 1.5rem;
  }

  .page-header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.6rem;
    color: var(--teal-dark);
  }

  .page-header p {
    margin: 0;
    color: var(--gray-muted);
    font-size: 0.95rem;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }

  thead th {
    background: var(--teal-dark);
    color: #fff;
    text-align: left;
    font-weight: 600;
    padding: 0.85rem 1rem;
    white-space: nowrap;
  }

  tbody td {
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border);
    color: var(--gray-text);
    vertical-align: middle;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  tbody tr:hover td {
    background: var(--teal-tint);
  }

  .dispense-btn {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .dispense-btn:hover:not(:disabled) {
    background: var(--teal-dark);
  }

  .dispense-btn:disabled {
    background: #b7c2bf;
    cursor: not-allowed;
  }

  .state-row td {
    text-align: center;
    padding: 2.2rem 1rem;
    color: var(--gray-muted);
    font-style: italic;
    border-bottom: none;
  }

  .state-row--error td {
    color: var(--danger);
  }

  /* Row fade-out when marked as dispensed */
  tr.row-dispensed {
    opacity: 0;
    transform: translateX(8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  tr.row-dispensed td {
    transition: padding 0.35s ease;
  }

  /* Toast notification */
  .pharmacy-toast {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    max-width: 340px;
    padding: 0.85rem 1.1rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    color: #fff;
    background: var(--teal);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
  }

  .pharmacy-toast.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .pharmacy-toast--error {
    background: var(--danger);
  }
</style>
</head>
<body>

<div class="page">
  <div class="page-header">
    <h1>Pharmacy Portal</h1>
    <p>Active prescriptions awaiting fulfillment</p>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Patient ID</th>
          <th>Patient Name</th>
          <th>Medication</th>
          <th>Dosage</th>
          <th>Frequency</th>
          <th>Prescribing Doctor</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="prescriptionsBody">
        <!-- Rows are rendered by pharmacy.js -->
      </tbody>
    </table>
  </div>
</div>

<!-- Pharmacy portal logic -->
<script src="pharmacy.js"></script>

<script>
  // Replace with your project's actual Supabase URL and anon key
  // (typically already defined somewhere shared in your app).
  const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  initPharmacyPortal(supabase, 'prescriptionsBody');
</script>

</body>
</html>
